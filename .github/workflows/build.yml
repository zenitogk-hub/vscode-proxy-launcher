name: Build EXE

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PyInstaller
      run: pip install pyinstaller

    - name: Build EXE
      run: pyinstaller --noconsole --onefile start_vscode.py

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: VS_Code_Launcher
        path: dist/start_vscode.exe
